<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Orders - Platform Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; display: flex; height: 100vh; overflow: hidden; }

        /* Left Sidebar Nav */
        .sidebar { width: 220px; background: #111827; color: #9ca3af; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-brand { font-size: 16px; font-weight: 700; color: #ffffff; padding: 0 20px 20px; border-bottom: 1px solid #1f2937; }
        .nav-section { margin-top: 15px; }
        .nav-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #6b7280; padding: 0 20px 8px; letter-spacing: 0.5px; }
        .nav-item { padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .nav-item.active { background: #1f2937; color: #3b82f6; border-left: 3px solid #3b82f6; }

        /* Main Workspace */
        .workspace { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-header { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-size: 18px; font-weight: 700; color: #111827; }

        .content-area { padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }
        
        /* Metric Cards Grid */
        .metrics-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
        .metric-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; text-align: center; }
        .metric-title { font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-bottom: 6px; }
        .metric-value { font-size: 26px; font-weight: 800; color: #111827; }
        
        .metric-pending { border-top: 4px solid #f59e0b; }
        .metric-processing { border-top: 4px solid #3b82f6; }
        .metric-processed { border-top: 4px solid #10b981; }
        .metric-failed { border-top: 4px solid #ef4444; }
        .metric-cancelled { border-top: 4px solid #6b7280; }

        /* Network Chips */
        .network-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab-chip { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; background: #ffffff; border: 1px solid #d1d5db; }
        .tab-chip.active-mtn { background: #fef08a; border-color: #eab308; color: #854d0e; }

        /* Table */
        .table-container { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: #f9fafb; padding: 12px 16px; font-weight: 700; color: #4b5563; border-bottom: 1px solid #e5e7eb; }
        td { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-fulfilled { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">⚡ GShare Client Portal</div>
        <div class="nav-section">
            <div class="nav-section-title">Catalog</div>
            <div class="nav-item active">Data Orders</div>
        </div>
    </div>

    <div class="workspace">
        <div class="top-header">
            <div class="header-title">Data orders</div>
        </div>

        <div class="content-area">
            <div class="network-tabs">
                <div class="tab-chip active-mtn">🟡 MTN</div>
            </div>

            <div class="metrics-grid">
                <div class="metric-card metric-pending"><div class="metric-title">PENDING</div><div class="metric-value" id="cnt-pending">1</div></div>
                <div class="metric-card metric-processing"><div class="metric-title">PROCESSING</div><div class="metric-value">0</div></div>
                <div class="metric-card metric-processed"><div class="metric-title">PROCESSED</div><div class="metric-value" id="cnt-processed">1</div></div>
                <div class="metric-card metric-failed"><div class="metric-title">FAILED</div><div class="metric-value">0</div></div>
                <div class="metric-card metric-cancelled"><div class="metric-title">CANCELLED</div><div class="metric-value">0</div></div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Order Ref</th>
                            <th>Recipient</th>
                            <th>Network</th>
                            <th>Bundle Size</th>
                            <th>Amount (GHS)</th>
                            <th>Processor</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                const tbody = document.getElementById('orders-tbody');
                
                tbody.innerHTML = orders.map(o => `
                    <tr>
                        <td><strong>${o.order_ref}</strong></td>
                        <td>${o.recipient_phone}</td>
                        <td>${o.network}</td>
                        <td>${o.bundle_size}</td>
                        <td>GHS ${parseFloat(o.amount_charged).toFixed(2)}</td>
                        <td>${o.processor}</td>
                        <td><span class="status-badge ${o.status === 'FULFILLED' ? 'badge-fulfilled' : 'badge-pending'}">${o.status}</span></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error loading orders:', err);
            }
        }
        fetchOrders();
    </script>
</body>
</html>
